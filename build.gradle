plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base {
    archivesName = project.archives_base_name
    group = project.maven_group
    version = "$mod_version+$minecraft_version"
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.meteordev.org/snapshots' }
    maven { url = 'https://maven.meteordev.org/releases' }
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Xaero's WorldMap + Minimap (compile against internals) — via Modrinth maven
    compileOnly "maven.modrinth:xaeros-world-map:fabric-26.2-1.44.2"
    compileOnly "maven.modrinth:xaeros-minimap:fabric-26.2-26.4.2"

    // Optional integrations
    compileOnly "maven.modrinth:modmenu:20.0.1"
    compileOnly "meteordevelopment:meteor-client:26.2-SNAPSHOT"
    compileOnly "meteordevelopment:baritone:26.2-SNAPSHOT"
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

processResources {
    filesMatching('fabric.mod.json') {
        expand(version: project.version)
    }
}
